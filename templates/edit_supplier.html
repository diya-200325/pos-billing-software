<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Supplier</title>

</head>

<body>

    <h1>Edit Supplier</h1>

    <form method="POST">

        <label>Supplier Name:</label>

        <input
            type="text"
            name="name"
            value="{{ supplier[1] }}"
            required
        >

        <br><br>

        <label>Phone:</label>

        <input
            type="text"
            name="phone"
            value="{{ supplier[2] }}"
        >

        <br><br>

        <label>Email:</label>

        <input
            type="email"
            name="email"
            value="{{ supplier[3] }}"
        >

        <br><br>

        <label>Address:</label>

        <textarea name="address">{{ supplier[4] }}</textarea>

        <br><br>

        <button type="submit">
            Update Supplier
        </button>

    </form>

    <br>

    <a href="/suppliers">
        Back to Suppliers
    </a>

</body>

</html>
