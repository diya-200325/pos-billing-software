<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>
</head>

<body>

    <h1>Edit Product</h1>

    <form method="POST">

        <label>Product Name:</label>
        <input
            type="text"
            name="name"
            value="{{ product[1] }}"
            required
        >

        <br><br>

        <label>Category:</label>
        <input
            type="text"
            name="category"
            value="{{ product[2] }}"
            required
        >

        <br><br>

        <label>Price:</label>
        <input
            type="number"
            name="price"
            step="0.01"
            value="{{ product[3] }}"
            required
        >

        <br><br>

        <label>Stock:</label>
        <input
            type="number"
            name="stock"
            value="{{ product[4] }}"
            required
        >

        <br><br>

        <label>Supplier:</label>
        <input
            type="text"
            name="supplier"
            value="{{ product[5] }}"
        >

        <br><br>

        <button type="submit">Update Product</button>

    </form>

    <br>

    <a href="/products">Back to Products</a>

</body>

</html>
