<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Staff</title>
</head>

<body>

    <h1>Edit Staff</h1>

    <form method="POST">

        <label>Staff Name:</label>
        <input
            type="text"
            name="name"
            value="{{ staff[1] }}"
            required
        >

        <br><br>

        <label>Login Email:</label>
        <input
            type="email"
            name="email"
            value="{{ staff[2] }}"
            required
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            value="{{ staff[3] }}"
            required
        >

        <br><br>

        <button type="submit">Update Staff</button>

    </form>

    <br>

    <a href="/staff-management">Back to Staff Management</a>

</body>

</html>
